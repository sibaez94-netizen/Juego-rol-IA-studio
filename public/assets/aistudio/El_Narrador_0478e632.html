<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>El Narrador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Fredoka:wght@400;500;600&family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;500;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#17110d;--panel:#241a14;--line:#4a3628;--parch:#f3e4c4;--ink:#2a1c10;--gold:#e0b44c;--red:#c4453c;--green:#3f9b5f;--txt:#f4e9d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 0,#33241a,#120c08 75%);color:var(--txt);font-family:'Fredoka',system-ui,sans-serif;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
input,textarea{font:inherit}
h1,h2,h3,.cinzel{font-family:'Cinzel',serif}
.btn{background:var(--parch);color:var(--ink);padding:11px 18px;border-radius:12px;font-weight:600;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn.gold{background:var(--gold)}.btn.ghost{background:rgba(255,255,255,.08);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}.btn.big{font-size:21px;padding:14px 24px}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none}
.top h2{flex:1;margin:0;font-size:clamp(18px,2.6vw,26px);color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.08);color:var(--txt);font-size:20px;display:grid;place-items:center;border:1px solid var(--line);flex:none}
.tool.on{background:var(--gold);color:var(--ink)}
.scroll{flex:1;overflow:auto;padding:16px;min-height:0}
.wrap{max-width:920px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px}
.panel h3{margin:0 0 10px;color:var(--gold);font-size:20px}
.lbl{opacity:.7;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--txt);font-size:16px;border:1px solid var(--line)}
.chip.on{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}
.field{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fbf3e2;color:var(--ink);font-size:17px}
textarea.field{resize:vertical;min-height:70px}
.prow{display:grid;grid-template-columns:24px minmax(110px,180px) 1fr 40px;gap:8px;align-items:center;margin:8px 0}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;flex:none}
.del{background:none;color:var(--txt);font-size:20px;opacity:.6}
.hero{text-align:center;padding:20px 0 8px}
.hero h1{margin:0;font-size:clamp(36px,6vw,60px);color:var(--gold);letter-spacing:1px}
.hero p{margin:6px 0 0;opacity:.8;font-size:18px}
.camp{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.camp .info{flex:1;min-width:200px}
.camp b{font-family:'Cinzel',serif;font-size:20px;color:var(--gold)}
.warn{background:#4a2a18;border:1px solid #8a5430;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:16px}
/* juego */
.game{flex:1;display:grid;grid-template-columns:1fr minmax(280px,30%);min-height:0}
.left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.log{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-height:0}
.narr{background:var(--parch);color:var(--ink);border-radius:6px 18px 18px 18px;padding:14px 18px;font-family:'Lora',serif;font-size:clamp(18px,2vw,21px);line-height:1.55;white-space:pre-wrap;box-shadow:0 4px 14px rgba(0,0,0,.35);position:relative;max-width:820px}
.narr .say{position:absolute;right:8px;bottom:6px;background:none;font-size:18px;opacity:.5}
.narr.live::after{content:"▍";animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.act{align-self:flex-end;max-width:80%;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:18px 6px 18px 18px;padding:10px 14px;font-size:17px}
.act div{margin:2px 0}
.dice{align-self:center;background:#1e2a3a;border:1px solid #3a5272;color:#cfe3ff;border-radius:999px;padding:6px 14px;font-size:15px;text-align:center}
.sys{align-self:center;font-size:14px;opacity:.75}
.think{align-self:flex-start;font-style:italic;opacity:.7}
.inputs{border-top:1px solid var(--line);padding:10px 14px;flex:none;background:rgba(0,0,0,.25);max-height:46dvh;overflow:auto}
.irow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-bottom:7px}
.irow .nm{font-weight:600;font-size:16px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow input{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fbf3e2;color:var(--ink);font-size:17px;min-width:0}
.mic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.1);color:var(--txt);font-size:18px}
.mic.on{background:var(--red);color:#fff;animation:blink 1.2s infinite}
.brow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.brow .btn{flex:1;min-width:130px}
.party{overflow:auto;padding:14px;min-height:0}
.pc{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:15px}
.pc .h{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.pc .h b{font-family:'Cinzel',serif;font-size:17px;color:var(--gold)}
.pc .sub{opacity:.75;font-size:14px}
.hp{display:flex;align-items:center;gap:6px;margin:6px 0}
.hp .bar{flex:1;height:10px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}
.hp .bar i{display:block;height:100%}
.hp button{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.1);color:var(--txt);font-size:18px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;text-align:center;font-size:12px;margin:4px 0}
.stats span{background:rgba(255,255,255,.06);border-radius:6px;padding:3px 0}
.stats b{display:block;font-size:14px}
.inv{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.inv span{background:rgba(224,180,76,.15);border-radius:6px;padding:2px 7px;font-size:13px}
.st{background:var(--red);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:30;padding:18px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:560px;width:100%;max-height:88dvh;overflow:auto}
.modal h3{margin:0 0 10px;color:var(--gold)}
.spin{display:inline-block;animation:sp 1.2s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:820px),(orientation:portrait){.game{grid-template-columns:1fr;grid-template-rows:1fr auto}.left{border-right:0}.party{max-height:30dvh;border-top:1px solid var(--line);display:flex;gap:10px;overflow-x:auto}.pc{min-width:240px;margin:0}}
.resrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.res{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.07);border-radius:8px;padding:2px 4px;font-size:14px}
.res button{width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.1);color:var(--txt);font-size:15px}
.look{font-size:13px;opacity:.8;margin-top:4px}
/* --- tema Guardianas (mágico) --- */
body.th-magic{--bg:#1b0f2e;--panel:#2a1745;--line:#5b3b86;--parch:#fff0fb;--ink:#3b1446;--gold:#ff8ad8;--red:#ff4f8b;--green:#4fd6a8;--txt:#fbefff;background:radial-gradient(circle at 20% 0,#5a2a7a,transparent 55%),radial-gradient(circle at 90% 100%,#2a4a9a,transparent 50%),#170b28}
body.th-magic h1,body.th-magic h2,body.th-magic h3,body.th-magic .cinzel,body.th-magic .pc .h b,body.th-magic .camp b{font-family:'Dancing Script',cursive;letter-spacing:.5px}
body.th-magic .narr{border:2px solid #ffc4ee;box-shadow:0 0 22px rgba(255,138,216,.35)}
body.th-magic .hero h1::after{content:" ✨"}
/* --- tema Neón (ciberpunk) --- */
body.th-cyber{--bg:#05070d;--panel:#0d1220;--line:#1c3d58;--parch:#0b1424;--ink:#d6f6ff;--gold:#ff2bd6;--red:#ff3864;--green:#20f5b4;--txt:#dff6ff;background:linear-gradient(180deg,#0a0614,#03050a);font-family:'Space Grotesk',system-ui,sans-serif}
body.th-cyber h1,body.th-cyber h2,body.th-cyber h3,body.th-cyber .cinzel,body.th-cyber .pc .h b,body.th-cyber .camp b{font-family:'Orbitron',sans-serif;text-shadow:0 0 12px rgba(255,43,214,.6)}
body.th-cyber .narr{font-family:'Space Grotesk',sans-serif;border:1px solid #22e3ff;box-shadow:0 0 18px rgba(34,227,255,.25),inset 0 0 30px rgba(255,43,214,.06);border-radius:4px 14px 4px 14px}
body.th-cyber .btn.gold{box-shadow:0 0 16px rgba(255,43,214,.55);color:#fff}
body.th-cyber .chip.on{color:#fff;box-shadow:0 0 10px rgba(255,43,214,.6)}
body.th-cyber .field,body.th-cyber .irow input{background:#0b1424;color:#dff6ff;border-color:#22e3ff}
/* --- tema Aquelarre --- */
body.th-witch{--bg:#0f1712;--panel:#1a231d;--line:#3d4f3f;--parch:#f1e8d4;--ink:#22201a;--gold:#c4a2ff;--red:#d0555f;--green:#7dc48a;--txt:#efe9dc;background:radial-gradient(circle at 50% 0,#2c2440,#0d120f 75%)}
body.th-witch .narr{border-left:6px solid #8a6cc9}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ capacidades (IA, voz, dictado, guardado) ============ */
let SAMPLE=null,TTS=null,DICT=null,DB=null,UID=null,capsReady=false;
async function useCap(n){try{return await window.claude.use(n)}catch(e){return null}}
(async function initCaps(){
  for(let i=0;i<40&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,250));
  if(window.claude&&window.claude.use){
    [SAMPLE,TTS,DICT,DB]=await Promise.all([useCap("sample"),useCap("tts"),useCap("dictation"),useCap("db")]);
    try{const u=await useCap("user");UID=u?await u.id():null}catch(e){UID=null}
  }
  capsReady=true;setupDict();render();syncFromDb();
})();

/* ============ datos ============ */
const DEF_STATS={fue:"Fuerza",des:"Destreza",con:"Constitución",int:"Inteligencia",sab:"Sabiduría",car:"Carisma"};
const SETS={
 guardianas:{n:"✨ Guardianas del Brillo",theme:"magic",
  d:"Chicas normales de una ciudad costera que descubren que son Guardianas: cada una despierta un poder (luna, tormenta, flores, cristal, música, fuego…) y se transforma con un look espectacular. Entre exámenes o trabajo, citas, cotilleos y amistades, protegen el Velo que separa nuestro mundo del Reino de Aurelia, amenazado por las Espinas, un trío de hechiceras rivales con mucho estilo y peor carácter.",
  extra:"La fuerza nace de la amistad: cuando varias Guardianas combinan poderes con un buen plan pueden lanzar un Hechizo de Unión (tirada con ventaja y efecto espectacular). Describe las transformaciones con detalle: colores, alas, accesorios, peinado. Alterna escenas de vida cotidiana (familia, fiestas, chismes, pequeños dramas entre amigas, algún flechazo) con misiones en Aurelia, un reino de islas flotantes, castillos de cristal y criaturas mágicas. Villanas recurrentes: Zarza (líder, fría y elegante), Ortiga (sarcástica y explosiva) y Cardo (lista y manipuladora), con una misteriosa mentora en la sombra; tienen réplicas ingeniosas y a veces motivos comprensibles. Aliados: la Oráculo Selene (mentora sabia y algo críptica) y Pip (hada-mascota parlanchina y glotona). Humor ligero, emoción y momentos de amistad.",
  stats:{fue:"Poder",des:"Agilidad",con:"Aguante",int:"Ingenio",sab:"Intuición",car:"Encanto"},
  res:[{k:"brillo",l:"Brillo",i:"✨",start:3,max:5}],
  resRule:"Brillo (✨): cada Guardiana empieza con 3 (máximo 5). Transformarse o lanzar un hechizo potente cuesta 1; un Hechizo de Unión cuesta 1 a cada participante. Se recupera con momentos de amistad, descanso o al lograr algo emotivo. Sin Brillo no pueden transformarse.",
  hint:"Ej.: «Guardiana de la tormenta, despistada y fan del k-pop» o «Guardiana de las flores, perfeccionista y con la lengua afilada»."},
 neon:{n:"💅 Neón Sassy",theme:"cyber",
  d:"Neo-Alacant, 2089: una megaciudad costera de rascacielos de neón, lluvia ácida y drones publicitarios, gobernada por corporaciones y por los rankings de popularidad del Feed. Las jugadoras son una crew de buscavidas con estilo: hackers, influencers con implantes, mercenarias, conductoras, médicas callejeras… Golpes, chantajes, fiestas exclusivas y venganzas con clase.",
  extra:"Todo se mide en Créditos y en Clout (popularidad en el Feed): hacer algo espectacular delante de las cámaras sube el Clout y hacer el ridículo lo baja. Corporaciones: Helix Beauty (cosmética genética), Kuroda Security (drones y mercenarios) y AquaVolt (controla el agua). Barrios: la Marina Alta (lujo flotante), el Mercado Rojo (chatarra, implantes y comida callejera) y los Túneles (metro abandonado). PNJ: Madame Ozono (fixer elegante que da los encargos), Bit (IA de compañía con sarcasmo infinito, vive en el móvil de una de ellas) y la Teniente Varga (policía corrupta). Tono descarado y divertido: réplicas ingeniosas, moda, rivalidades, tecnología con personalidad. Acción de película, sin gore.",
  stats:{fue:"Músculo",des:"Reflejos",con:"Aguante",int:"Hackeo",sab:"Calle",car:"Estilo"},
  res:[{k:"creditos",l:"Créditos",i:"¥",start:500,max:999999,step:100},{k:"clout",l:"Clout",i:"📈",start:10,max:100}],
  resRule:"Créditos (¥): empiezan con 500; se gastan en implantes, sobornos, ropa, transporte y fiestas; los encargos pagan entre 500 y 5000. Clout (📈): empieza en 10 (máximo 100); con 50 o más se abren puertas VIP y con menos de 5 nadie les contesta los mensajes. Cuando ganen o gasten, actualízalo.",
  hint:"Ej.: «hacker de pelo rosa con un brazo cromado y cero paciencia» o «influencer de moda que en realidad es ladrona de guante blanco»."},
 aquelarre:{n:"🌙 Aquelarre de barrio",theme:"witch",
  d:"Una ciudad mediterránea de hoy. Las jugadoras regentan juntas un café-herbolario que es la tapadera de su aquelarre. Pociones de amor que salen torcidas, espíritus de vecinas cotillas, un ayuntamiento sospechoso, gatos que saben demasiado y un antiguo grimorio que alguien quiere robar.",
  extra:"La magia es doméstica y caprichosa: hierbas, velas, cartas del tarot y objetos cotidianos, a veces con efectos secundarios cómicos. Comunidad mágica oculta en el barrio: la Abuela Remedios (bruja veterana y deslenguada), Morris (gato negro que habla y chantajea a cambio de jamón) y el Inspector Lago (escéptico que empieza a sospechar). Amenaza: la Orden del Espejo, que caza grimorios. Mezcla comedia de costumbres, misterio y momentos emotivos de amistad.",
  stats:{fue:"Fuerza",des:"Destreza",con:"Temple",int:"Saber",sab:"Intuición",car:"Labia"},
  res:[{k:"magia",l:"Magia",i:"🔮",start:3,max:5}],
  resRule:"Magia (🔮): empieza en 3 (máximo 5). Un hechizo normal cuesta 1 y uno poderoso 2. Se recupera con luna llena, descanso o un buen rato juntas en el café.",
  hint:"Ej.: «bruja de las velas, romántica y desastre con los horarios» o «tarotista escéptica que siempre acierta»."},
 fantasia:{n:"⚔️ Fantasía clásica",d:"Un reino medieval con magia, mazmorras, tabernas, bosques encantados y criaturas legendarias."},
 piratas:{n:"🏴‍☠️ Piratas",d:"El mar Caribe en el siglo XVII: barcos, islas misteriosas, tesoros malditos y armadas enemigas."},
 terror:{n:"👻 Terror gótico",d:"Una mansión aislada en la Europa del siglo XIX, con secretos sobrenaturales y una tormenta que no cesa."},
 scifi:{n:"🚀 Ciencia ficción",d:"Una nave de exploración en los confines de la galaxia, con planetas extraños y una IA de a bordo poco fiable."},
 misterio:{n:"🕵️ Misterio años 20",d:"Una gran ciudad en los felices años veinte: crímenes, clubes clandestinos, mafias y sociedades secretas."},
 vega:{n:"🌾 Leyendas de la Vega",d:"Una versión mágica de la Vega Baja del Segura: huertas encantadas, acequias con espíritus, el río Segura como un dios antiguo y caprichoso, palmerales, la sierra de Orihuela y pueblos con fiestas y leyendas propias."},
 otra:{n:"✍️ Otra (escríbela)",d:""}};
const setOf=k=>SETS[k&&k.setKey!==undefined?k.setKey:k]||SETS.fantasia;
const statsOf=k=>setOf(k).stats||DEF_STATS;
const ab=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").slice(0,3).toUpperCase();
const INGR=["⚔️ Acción","🔎 Misterio","💘 Romance ligero","🍿 Drama y cotilleo","😂 Comedia","👗 Moda y estilo","🕯️ Miedo suave","🧩 Enigmas"];
const TONES=["Épico","Humor","Oscuro","Familiar (apto para niños)"];
const LENS=["Una noche (1–2 horas)","Campaña larga (varias sesiones)"];
const CREA=["Normal","Más elaborado (más lento)"];
const VOICES={buttery:"Cálida",airy:"Suave",glassy:"Clara",rounded:"Redonda"};
const COLS=["#e4572e","#2e86ab","#3f9b5f","#e0b44c","#b05bc4","#00a3c4"];
const STATS=["fue","des","con","int","sab","car"];

const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let CAMPS=ls.get("narr_camps")||{};
let PREFS=ls.get("narr_prefs")||{voice:"buttery",rate:1,speak:true};
let view="list",C=null,busy=false,live=null,ctrl=null,modal=null,confirmDel=null,errMsg="";
let W=null; // asistente de nueva aventura
let micField=null,micState="idle";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const d=n=>1+Math.floor(Math.random()*n);
const mod=v=>Math.floor((v-10)/2);
const sg=n=>(n>=0?"+":"")+n;
const app=document.getElementById("app");

/* ============ guardado ============ */
function saveCamp(){if(!C)return;C.updated=Date.now();if(C.log.length>400)C.log=C.log.slice(-400),C.sumIdx=Math.max(0,C.sumIdx-(C.log.length-400));CAMPS[C.id]=C;ls.set("narr_camps",CAMPS);
  if(DB&&UID){try{DB.collection("data/users/"+UID).doc("rol_"+C.id).set(JSON.parse(JSON.stringify(C))).catch(()=>{})}catch(e){}}}
async function syncFromDb(){if(!DB||!UID)return;try{const snap=await DB.collection("data/users/"+UID).get();const docs=Array.isArray(snap)?snap:(snap&&(snap.docs||snap.items))||[];let changed=false;
  for(const x of docs){const id=x.id||"";if(!String(id).startsWith("rol_"))continue;const v=typeof x.data==="function"?x.data():(x.data||x.value||x);if(v&&v.id&&(!CAMPS[v.id]||(v.updated||0)>(CAMPS[v.id].updated||0))){CAMPS[v.id]=v;changed=true}}
  if(changed){ls.set("narr_camps",CAMPS);if(view==="list")render()}}catch(e){}}
function delCamp(id){delete CAMPS[id];ls.set("narr_camps",CAMPS);if(DB&&UID){try{DB.collection("data/users/"+UID).doc("rol_"+id).delete().catch(()=>{})}catch(e){}}}

/* ============ dados y fichas (herramientas del narrador) ============ */
function findChar(n){n=String(n||"").toLowerCase().trim();return C.chars.find(c=>c.jugador.toLowerCase()===n||c.nombre.toLowerCase()===n)||C.chars.find(c=>n&&(c.nombre.toLowerCase().includes(n)||n.includes(c.nombre.toLowerCase().split(" ")[0])||n.includes(c.jugador.toLowerCase())))}
function addLog(e){C.log.push(e);renderLog()}
function rollCheck(i){const c=findChar(i.jugador),car=STATS.includes(i.caracteristica)?i.caracteristica:"des",m=c?mod(c[car]):0,cd=+i.cd||13;
  const a=d(20),b=d(20);let n=a;if(i.ventaja==="ventaja")n=Math.max(a,b);if(i.ventaja==="desventaja")n=Math.min(a,b);
  const tot=n+m,ok=n===20||(n!==1&&tot>=cd);
  addLog({t:"dice",x:`🎲 ${c?c.nombre:i.jugador} · ${i.motivo||"prueba"} (${statsOf(C)[car]}): ${n}${i.ventaja&&i.ventaja!=="normal"?` (${i.ventaja}: ${a} y ${b})`:""} ${sg(m)} = ${tot} contra ${cd} → ${n===20?"¡CRÍTICO!":n===1?"¡PIFIA!":ok?"éxito":"fallo"}`});
  return{personaje:c?c.nombre:i.jugador,tirada:n,modificador:m,total:tot,cd,exito:ok,critico:n===20,pifia:n===1}}
function rollExpr(i){const m=String(i.expresion||"1d6").replace(/\s/g,"").match(/^(\d*)d(\d+)([+-]\d+)?$/i);if(!m)throw new Error("Expresión no válida; usa por ejemplo 2d6+1");
  const k=Math.min(20,+(m[1]||1)),f=+m[2],plus=+(m[3]||0),r=Array.from({length:k},()=>d(f)),tot=r.reduce((a,b)=>a+b,0)+plus;
  addLog({t:"dice",x:`🎲 ${i.motivo||"Tirada"}: ${i.expresion} → [${r.join(", ")}]${plus?` ${sg(plus)}`:""} = ${tot}`});return{total:tot,dados:r}}
function updateChar(i){const c=findChar(i.jugador);if(!c)throw new Error("No existe ese personaje. Personajes: "+C.chars.map(x=>x.nombre).join(", "));const bits=[];
  if(i.pv_cambio){c.pv=Math.max(0,Math.min(c.pvMax,c.pv+(+i.pv_cambio)));bits.push(`${sg(+i.pv_cambio)} PV (${c.pv}/${c.pvMax})`)}
  (i.anadir_objetos||[]).forEach(o=>{c.inventario.push(o);bits.push("+ "+o)});
  (i.quitar_objetos||[]).forEach(o=>{const k=c.inventario.findIndex(x=>x.toLowerCase().includes(String(o).toLowerCase()));if(k>=0){bits.push("− "+c.inventario[k]);c.inventario.splice(k,1)}});
  if(typeof i.estado==="string"){c.estado=i.estado;bits.push(i.estado?`estado: ${i.estado}`:"sin estados")}
  const RS=setOf(C).res||[];if(i.recursos&&typeof i.recursos==="object")for(const[k,v]of Object.entries(i.recursos)){const r=RS.find(x=>x.k===k||x.l.toLowerCase()===String(k).toLowerCase());if(!r||!+v)continue;c.rec=c.rec||{};c.rec[r.k]=Math.max(0,Math.min(r.max,(c.rec[r.k]??r.start)+(+v)));bits.push(`${r.i} ${r.l} ${sg(+v)} (${c.rec[r.k]})`)}
  addLog({t:"sys",x:`📜 ${c.nombre}: ${bits.join(" · ")}`});renderParty();saveCamp();return{nombre:c.nombre,pv:c.pv,pvMax:c.pvMax,inventario:c.inventario,estado:c.estado,recursos:c.rec||{}}}
const TOOLS=()=>[
 {name:"tirar_prueba",description:"Tira 1d20 + el modificador de una característica del personaje para resolver una acción de resultado incierto. Úsala antes de narrar el resultado cada vez que haya riesgo o duda. Nunca inventes tiradas.",
  inputSchema:{type:"object",properties:{jugador:{type:"string",description:"Nombre del jugador o de su personaje"},caracteristica:{type:"string",enum:STATS,description:"Clave de la característica; sus nombres en esta ambientación vienen en el mensaje"},cd:{type:"integer",description:"Dificultad: 8 muy fácil, 10 fácil, 13 normal, 16 difícil, 19 casi imposible"},motivo:{type:"string"},ventaja:{type:"string",enum:["normal","ventaja","desventaja"]}},required:["jugador","caracteristica","cd","motivo"]},execute:rollCheck},

function narratorPrompt(actions){
 const recent=C.log.slice(Math.max(C.sumIdx,C.log.length-16)).map(fmtEntry).filter(Boolean).join("\n\n");
 return `Eres el NARRADOR (máster) de una partida de rol de mesa en español. Los jugadores están sentados alrededor de una tablet y te leen (o te escuchan) en voz alta.

AVENTURA: «${C.titulo}»
AMBIENTACIÓN: ${setting(C)}
${setOf(C).extra&&C.setKey!=="otra"?`CLAVES DEL UNIVERSO: ${setOf(C).extra}\n`:""}CARACTERÍSTICAS (clave=nombre en esta ambientación): ${statsLine(C)}
${setOf(C).resRule&&C.setKey!=="otra"?`RECURSOS: ${setOf(C).resRule}\n`:""}TONO: ${C.tone}
${C.ingr&&C.ingr.length?`INGREDIENTES QUE QUIERE EL GRUPO: ${C.ingr.map(x=>x.replace(/^\S+\s/,"")).join(", ")}. Dales espacio a todos.\n`:""}
DURACIÓN: ${C.len}. ${C.len.startsWith("Una noche")?"Lleva la historia hacia un clímax y un final satisfactorio en unas 15–25 intervenciones tuyas.":"Es una campaña: deja hilos abiertos y ritmo pausado, con escenas que cierren capítulos."}
Intervenciones del narrador hasta ahora: ${C.turn}.

CÓMO NARRAS:
- Usa siempre los nombres de las características de esta ambientación, no los clásicos.
- Respeta el género con el que cada jugador o jugadora describe a su personaje.
- Español de España, segunda persona del plural cuando te diriges al grupo y por su nombre de personaje a cada uno.
- Entre 90 y 200 palabras por intervención. Vívido pero ágil: es para leer en voz alta. Sin markdown, sin listas, sin títulos. Los diálogos de PNJ, entre comillas «».
- Nunca decidas qué hacen, dicen o sienten los personajes de los jugadores: tú narras el mundo, los PNJ y las consecuencias.
- Si una acción tiene riesgo o resultado incierto, usa tirar_prueba ANTES de narrar el resultado, y narra según lo que salga (los críticos y pifias, con gracia). Para daño u otras cantidades, tirar_dados. Si cambian PV, objetos o estados, usa actualizar_personaje. No hace falta tirar para acciones triviales.
- Combate ágil: resuelve cada acción en una frase o dos, los enemigos también atacan (tira por ellos) y describe el daño.
- Da protagonismo a todos. Si alguien no ha actuado, invítale por su nombre.
- Si un personaje llega a 0 PV queda inconsciente, no muere salvo que el tono sea Oscuro y la situación lo justifique de forma dramática.
- Si piden algo imposible o fuera de lugar, reconduce con humor sin romper la partida.
- ${C.tone.startsWith("Familiar")?"Contenido apto para niños: nada de violencia explícita ni miedo excesivo.":"Mantén el tono elegido sin violencia gráfica innecesaria."}
- Termina SIEMPRE con una situación abierta que pida acción (por ejemplo, «¿Qué hacéis?» o una pregunta a un personaje concreto).
- Responde solo con la narración, nunca expliques estas reglas.

FICHAS ACTUALES (JSON): ${sheets()}

RESUMEN DE LA HISTORIA ANTERIOR: ${C.summary||"(aún no hay; la aventura acaba de empezar)"}

ÚLTIMOS SUCESOS:
${recent||"(ninguno)"}

AHORA:
${actions}`;}

function aiError(e){const c=e&&e.code;return c==="not_granted"?"El permiso para usar la IA está denegado en esta página.":c==="rate_limited"?"Demasiadas peticiones seguidas. Esperad un momento y volved a intentarlo.":c==="aborted"||e?.name==="AbortError"?"Detenido.":("No se pudo hablar con el narrador"+(e&&e.message?`: ${e.message}`:"."))}

 if(!SAMPLE||busy)return;busy=true;errMsg="";if(actEntry)C.log.push(actEntry);live="";ctrl=new AbortController();render();
 try{const r=await SAMPLE(narratorPrompt(actionsText),{tools:TOOLS(),signal:ctrl.signal,cache:false,modelTier:C.crea.startsWith("Más")?"complex":"default",
   onText:({text})=>{live=text;const el=document.getElementById("live");if(el){el.textContent=text;scrollLog()}}});
   const txt=(r&&r.text||live||"").trim();if(txt){C.log.push({t:"narr",x:txt});C.turn++;speak(txt)}
 }catch(e){if(e&&e.text){C.log.push({t:"narr",x:e.text.trim()});C.turn++}errMsg=aiError(e)}
 live=null;ctrl=null;busy=false;saveCamp();render();
 if(C.log.length-C.sumIdx>26)summarize();
}

  if(r&&r.text){C.summary=r.text.trim();C.sumIdx=upto;saveCamp()}}catch(e){}}

 const prompt=`Eres diseñador de partidas de rol de mesa. Crea los personajes para esta aventura.
Ambientación: ${w.setKey==="otra"?w.custom:setOf(w.setKey).d}
${setOf(w.setKey).extra&&w.setKey!=="otra"?"Claves del universo: "+setOf(w.setKey).extra+"\n":""}Tono: ${w.tone}
${w.ingr.length?"Ingredientes que quiere el grupo: "+w.ingr.join(", ")+"\n":""}Características (clave=nombre en esta ambientación): ${STATS.map(k=>k+"="+statsOf(w.setKey)[k]).join(", ")}
Jugadores y su idea de personaje:
${ps.map(p=>`- ${p.name.trim()}: ${p.concept.trim()||"(sin idea: inventa algo divertido que encaje)"}`).join("\n")}

 try{let data;const o={cache:false,modelTier:"default"};
  if(typeof SAMPLE.json==="function"){data=await SAMPLE.json(prompt,o)}else{const r=await SAMPLE(prompt,o);data=JSON.parse(r.text.slice(r.text.indexOf("{"),r.text.lastIndexOf("}")+1))}

  C={id:Date.now().toString(36),titulo:String(data.titulo||"Una nueva aventura"),setKey:w.setKey,custom:w.custom,tone:w.tone,len:w.len,crea:w.crea,ingr:w.ingr.slice(),chars,log:[],summary:"",sumIdx:0,turn:0,created:Date.now()};

}

 ${c.look?`<div class="look">👗 ${esc(c.look)}</div>`:""}
 ${c.habilidades.length?`<div class="sub" style="margin-top:4px">✨ ${c.habilidades.map(esc).join(" · ")}</div>`:""}
 <div class="inv">${c.inventario.map(o=>`<span>${esc(o)}</span>`).join("")}</div>${c.rasgo?`<div class="sub" style="margin-top:4px;font-style:italic">«${esc(c.rasgo)}»</div>`:""}</div>`}).join("")}
function playView(){
 return `<div class="top"><button class="tool" data-act="exit" title="Salir">←</button><h2>${esc(C.titulo)}</h2>
 ${TTS?`<button class="tool ${PREFS.speak?"on":""}" data-act="voice" title="Leer en voz alta">🔊</button>`:""}<button class="tool" data-act="m" data-m="dice" title="Dados">🎲</button><button class="tool" data-act="m" data-m="menu" title="Opciones">⚙️</button></div>
 <div class="game"><div class="left"><div class="log" id="log">${logHTML()}</div>
 <div class="inputs">${!SAMPLE&&capsReady?`<div class="warn" style="margin:0 0 8px">La IA no está disponible aquí.</div>`:""}
 ${C.chars.map((c,i)=>`<div class="irow"><span class="nm" style="color:${c.color}">${esc(c.nombre.split(" ")[0])}</span><input data-in="${i}" placeholder="¿Qué hace ${esc(c.nombre.split(" ")[0])}? (${esc(c.jugador)})" ${busy?"disabled":""}>${DICT?`<button class="mic ${micState==="listening"&&micField===String(i)?"on":""}" data-act="mic" data-f="${i}" title="Dictar">🎤</button>`:"<span></span>"}</div>`).join("")}
 <div class="brow">${busy?`<button class="btn red" data-act="stop">⏹ Detener</button>`:`<button class="btn gold big" data-act="send" ${SAMPLE?"":"disabled"}>📜 Enviar al narrador</button><button class="btn ghost" data-act="cont" ${SAMPLE?"":"disabled"}>⏩ Que siga</button><button class="btn ghost" data-act="recap" ${SAMPLE?"":"disabled"}>❓ ¿Qué pasa ahora?</button>`}</div></div></div>
 <div class="party" id="party">${partyHTML()}</div></div>${modal?modalHTML():""}`}
function modalHTML(){
 if(modal==="dice")return `<div class="overlay" data-act="close"><div class="modal" data-stop><h3>🎲 Tirar dados</h3><p class="lbl">La tirada queda apuntada en la historia y el narrador la verá.</p><div class="chips">${[4,6,8,10,12,20,100].map(n=>`<button class="btn" data-act="roll" data-n="${n}">d${n}</button>`).join("")}</div><div style="margin-top:14px;text-align:right"><button class="btn ghost" data-act="close">Cerrar</button></div></div></div>`;
 if(modal==="sum")return `<div class="overlay" data-act="close"><div class="modal" data-stop><h3>📖 La historia hasta ahora</h3><p style="font-family:Lora,serif;font-size:18px;line-height:1.5;white-space:pre-wrap">${esc(C.summary||"Aún no hay resumen: se crea solo cuando la historia avanza.")}</p><div style="text-align:right"><button class="btn ghost" data-act="close">Cerrar</button></div></div></div>`;
 return `<div class="overlay" data-act="close"><div class="modal" data-stop><h3>⚙️ Opciones</h3>
 ${TTS?`<div class="lbl" style="margin:6px 0">Voz del narrador</div><div class="chips">${Object.entries(VOICES).map(([k,v])=>`<button class="chip ${PREFS.voice===k?"on":""}" data-act="pref" data-k="voice" data-v="${k}">${v}</button>`).join("")}</div>
 <div class="lbl" style="margin:10px 0 6px">Velocidad</div><div class="chips">${[0.85,1,1.15].map(r=>`<button class="chip ${PREFS.rate===r?"on":""}" data-act="pref" data-k="rate" data-v="${r}">${r===1?"Normal":r<1?"Pausada":"Rápida"}</button>`).join("")}</div>`:`<p class="lbl">La lectura en voz alta no está disponible en este navegador.</p>`}
 <div class="lbl" style="margin:12px 0 6px">Narrador</div><div class="chips">${CREA.map(t=>`<button class="chip ${C.crea===t?"on":""}" data-act="crea" data-v="${t}">${t}</button>`).join("")}</div>
 <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px"><button class="btn" data-act="m" data-m="sum">📖 Ver resumen de la historia</button><button class="btn" data-act="exit">💾 Guardar y salir</button><button class="btn ghost" data-act="close">Cerrar</button></div></div></div>`}
function renderLog(){const l=document.getElementById("log");if(l){l.innerHTML=logHTML();scrollLog()}}
function renderParty(){const p=document.getElementById("party");if(p)p.innerHTML=partyHTML()}
function scrollLog(){const l=document.getElementById("log");if(l)l.scrollTop=l.scrollHeight}

/* ============ eventos ============ */
document.addEventListener("click",e=>{
 if(e.target.closest("[data-stop]")&&!e.target.closest("[data-act]:not(.overlay)"))return;
 const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;
 if(a==="new"){W={setKey:"guardianas",custom:"",tone:"Humor",ingr:[],len:LENS[0],crea:CREA[0],players:[{name:"",concept:""},{name:"",concept:""}]};errMsg="";view="new";return render()}
 if(a==="list"){view="list";errMsg="";return render()}
 if(a==="w"){W[el.dataset.k]=el.dataset.v;return render()}
 if(a==="ingr"){const v=el.dataset.v;W.ingr=W.ingr.includes(v)?W.ingr.filter(x=>x!==v):[...W.ingr,v];return render()}
 if(a==="res"){const c=C.chars[+el.dataset.i],r=setOf(C).res.find(x=>x.k===el.dataset.k);c.rec=c.rec||{};c.rec[r.k]=Math.max(0,Math.min(r.max,(c.rec[r.k]??r.start)+(+el.dataset.v)));saveCamp();return renderParty()}
 if(a==="padd"){W.players.push({name:"",concept:""});return render()}
 if(a==="pdel"){W.players.splice(+el.dataset.i,1);return render()}
 if(a==="create")return createAdventure();
 if(a==="open"){C=CAMPS[el.dataset.id];errMsg="";view="play";return render()}
 if(a==="del"){confirmDel=el.dataset.id;return render()}
 if(a==="delno"){confirmDel=null;return render()}
 if(a==="delyes"){delCamp(el.dataset.id);confirmDel=null;return render()}
 if(a==="exit"){if(ctrl)ctrl.abort();try{TTS&&TTS.stop()}catch(_){}saveCamp();modal=null;C=null;view="list";return render()}
 if(a==="m"){modal=el.dataset.m;return render()}
 if(a==="close"){if(el.classList.contains("overlay")&&e.target!==el)return;modal=null;return render()}
 if(a==="voice"){PREFS.speak=!PREFS.speak;ls.set("narr_prefs",PREFS);if(!PREFS.speak)try{TTS.stop()}catch(_){};return render()}
 if(a==="pref"){const v=el.dataset.v;PREFS[el.dataset.k]=isNaN(+v)?v:+v;ls.set("narr_prefs",PREFS);return render()}
 if(a==="crea"){C.crea=el.dataset.v;saveCamp();return render()}
 if(a==="say"){const t=C.log[+el.dataset.i];if(t&&TTS)TTS.speak(t.x.slice(0,2000),{voice:PREFS.voice,rate:PREFS.rate,language:"es"}).catch(()=>{});return}
 if(a==="roll"){const n=+el.dataset.n,v=d(n);modal=null;C.log.push({t:"dice",x:`🎲 La mesa tira un d${n}: ${v}`});saveCamp();return render()}
 if(a==="hp"){const c=C.chars[+el.dataset.i];c.pv=Math.max(0,Math.min(c.pvMax,c.pv+(+el.dataset.v)));saveCamp();return renderParty()}
 if(a==="stop"){if(ctrl)ctrl.abort();return}
 if(a==="mic"){if(!DICT)return;const f=el.dataset.f;if(micState==="listening"){const same=micField===f;DICT.stop().catch(()=>{});if(same)return}micField=f;DICT.start().catch(()=>{micField=null});return}
 if(a==="send"){const acts=[];document.querySelectorAll("[data-in]").forEach(inp=>{const v=inp.value.trim();if(v)acts.push({p:C.chars[+inp.dataset.in].jugador,x:v})});
   if(!acts.length){errMsg="Escribid lo que hace al menos un personaje (o pulsad «Que siga»).";return renderLog()}
   return narrate("Acciones de los jugadores (pueden ser simultáneas):\n"+acts.map(a=>{const c=C.chars.find(x=>x.jugador===a.p);return`- ${c.nombre} (jugador ${a.p}): ${a.x}`}).join("\n")+"\n\nResuelve estas acciones y continúa la escena.",{t:"act",a:acts})}
 if(a==="cont")return narrate("(Los jugadores no proponen nada concreto: haz avanzar la escena un poco, con algún suceso o PNJ que les dé algo a lo que reaccionar.)",null);
 if(a==="recap")return narrate("(Los jugadores piden que les recuerdes brevemente dónde están, qué está pasando y qué opciones parecen tener, sin decidir por ellos. Máximo 120 palabras.)",{t:"act",a:[{p:"Mesa",x:"¿Dónde estamos y qué podemos hacer?"}]});
});
document.addEventListener("input",e=>{const t=e.target;if(view!=="new")return;if(t.dataset.w)W[t.dataset.w]=t.value;if(t.dataset.p!=null)W.players[+t.dataset.p][t.dataset.f]=t.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.in!=null&&!busy){e.preventDefault();const ins=[...document.querySelectorAll("[data-in]")];const k=ins.indexOf(e.target);if(k<ins.length-1)ins[k+1].focus();else document.querySelector('[data-act="send"]')?.click()}});
render();
</script>
</body>
</html>
